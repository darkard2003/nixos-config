# Thorough Wallust dynamic theme for Tmux

# Unset any stale global plugin styles
set -gu status-style
set -gu status-left-style
set -gu status-right-style
setw -gu window-status-style
setw -gu window-status-current-style

# Status line base (Transparent background to inherit terminal background)
set -g status-style "bg=default,fg={{foreground}}"
set -g status-left-length 50
set -g status-right-length 100

# Status widgets (Session name on left, Time/Date on right)
set -g status-left "#[fg={{background}},bg={{color4}},bold]  #S #[fg={{color4}},bg=default] "
set -g status-right "#[fg={{color4}},bg=default]#[fg={{background}},bg={{color4}},bold] %H:%M %d-%b-%y "

# Window tabs (High Contrast, Transparent Inactive Tabs)
setw -g window-status-style "bg=default,fg={{color7}}"
setw -g window-status-format " #I:#W#F "

setw -g window-status-current-style "bg={{color5}},fg={{background}},bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg={{color8}}"
set -g pane-active-border-style "fg={{color4}},bold"

# Command line and messaging
set -g message-style "fg={{background}},bg={{color4}},bold"
set -g message-command-style "fg={{background}},bg={{color5}},bold"

# Copy / Selection mode
setw -g mode-style "fg={{background}},bg={{color6}},bold"

# Clock mode
setw -g clock-mode-color "{{color4}}"
