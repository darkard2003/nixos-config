#
# Window Borders & Gaps
#
default_border pixel 3
gaps inner 8
gaps outer 8

#
# SwayFX Special Effects
#
blur enable
blur_passes 3
blur_radius 5
corner_radius 10
shadows enable
default_dim_inactive 0.1
titlebar_separator enable
animation_duration_ms 250

for_window [floating] dim_inactive 0

# layer_effects "kitty-quick-access" {
#     blur enable
#     blur_ignore_transparent false
#     corner_radius 10
# }

layer_effects "swaync-control-center" {
    blur enable
    blur_ignore_transparent enable
    shadows disable
    corner_radius 10
}

layer_effects "swaync-notification-window" {
    blur disable
}

layer_effects "gtk-layer-shell" {
    blur enable
    blur_ignore_transparent enable
    shadows disable
    corner_radius 10
}

#
# Fallback Default Theme Colors
#
set $background          #1e1e2e
set $foreground          #cdd6f4
set $cursor              #cdd6f4
set $color0              #1e1e2e
set $color1              #f38ba8
set $color2              #a6e3a1
set $color3              #f9e2af
set $color4              #89b4fa
set $color5              #f5c2e7
set $color6              #94e2d5
set $color7              #bac2de
set $color8              #585b70
set $color9              #f38ba8
set $color10             #a6e3a1
set $color11             #f9e2af
set $color12             #89b4fa
set $color13             #f5c2e7
set $color14             #94e2d5
set $color15             #a6adc8

# Dynamic Wallust Theme (overrides fallbacks when generated)
include ~/.cache/wallust/colors-sway

set $bg-color            $background
set $text-color          $foreground
set $inactive-bg-color   $color0
set $inactive-text       $color7
set $urgent-bg-color     $color1
set $urgent-text         $foreground
set $border-color        $color4
set $indicator           $color6

client.focused           $border-color   $bg-color          $text-color     $indicator    $border-color
client.focused_inactive  $color0         $color0            $inactive-text  $indicator    $color0
client.unfocused         $color0         $color0            $inactive-text  $indicator    $color0
client.urgent            $urgent-bg-color $urgent-bg-color  $urgent-text    $indicator    $urgent-bg-color
