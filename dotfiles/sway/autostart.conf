# Session Environment & Systemd Target
exec systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP && systemctl --user start sway-session.target

# Autostart Desktop Daemons
# exec awww-daemon
# exec dex -a -e sway (disabled to prevent double autostarts alongside systemd.xdgAutostart)

# Startup Applications
exec swaymsg "workspace 2; exec $term"
exec swaymsg "workspace 1; exec $term"

