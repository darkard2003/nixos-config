#
# Displays & Inputs
#
output {
    eDP-1 scale 1.5
    DP-2 scale 1.5
    DP-1 scale 1.5
}

input type:touchpad {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
}

#
# Workspace Output Assignments & Mouse Settings
#
workspace 1 output $disp1
workspace 2 output $disp1
workspace 3 output $disp1
workspace 4 output $disp1

focus_follows_mouse no
mouse_warping container

#
# Window Rules & Behavior
#
for_window {
    [shell="xwayland"] title_format "%title [XWayland]"
    [app_id="firefox"] inhibit_idle fullscreen
    [app_id="floorp"] inhibit_idle fullscreen
    [app_id="zen"] inhibit_idle focus
    [app_id="mpv"] inhibit_idle fullscreen

    [window_role="pop-up"] floating enable
    [window_role="bubble"] floating enable
    [window_role="dialog"] floating enable
    [window_type="dialog"] floating enable

    [app_id="user-dialog"] {
        floating enable
        resize set 720 480
        focus_on_window_activation focus
        popup_during_fullscreen smart
        focus_wrapping no
        kill on focus loss
    }

    [title="(?i)picture[- ]in[- ]picture"] {
        floating enable
        sticky enable
        resize set 480 270
        # Position: Bottom-Right (Active)
        move position 100 ppt 100 ppt
        move left 500 px
        move up 290 px
        # Alternative positions:
        # Top-Right:    move position 100 ppt 0 ppt; move left 500 px; move down 20 px
        # Bottom-Left:  move position 0 ppt 100 ppt; move right 20 px; move up 290 px
        # Top-Left:     move position 0 ppt 0 ppt; move right 20 px; move down 20 px
    }

    [app_id="pavucontrol"] {
        floating enable
        resize set 720 480
    }

    [class="PenTablet"] {
        floating enable
        move scratchpad
        focus_on_window_activation none
    }

    [app_id="SwayNotificationCenter"] border none
    [app_id="swaync"] border none
    [class="SwayNotificationCenter"] border none
}
