set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term kitty
set $menu_term kitty
set $menu "wofi --show=drun --conf /home/dark/.config/wofi/config --style /home/dark/.config/wofi/style.css"
set $commands "wofi --show=run --conf /home/dark/.config/wofi/config --style /home/dark/.config/wofi/style.css"
set $browser qutebrowser
set $explorer thunar

set $WOBSOCK $XDG_RUNTIME_DIR/wob.sock

set $CONFIG_DIR ~/nixos-config
set $WALL_DIR $CONFIG_DIR/wallpapers
set $SCRIPT_DIR $HOME/.local/bin

set $disp1 eDP-1
set $disp2 DP-2

